<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>evgn OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #F5F0E6; color: #2C1810; min-height: 100vh; padding: 48px 16px; }
    .wrap { max-width: 640px; margin: 0 auto; }
    .wordmark { font-family: Georgia, serif; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #8B7355; text-align: center; margin-bottom: 24px; }
    .divider { width: 40px; height: 1px; background: #C4B49A; margin: 0 auto 40px; }
    h1 { font-family: Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.3; text-align: center; margin-bottom: 10px; }
    .sub { text-align: center; color: #6B5B47; font-size: 15px; line-height: 1.6; margin-bottom: 40px; }
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #3F6B4A; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3F6B4A; }
    .card { background: #FDFAF5; border: 1px solid #E2D7C3; border-radius: 2px; padding: 28px; margin-bottom: 20px; }
    .card h2 { font-family: Georgia, serif; font-weight: 400; font-size: 18px; margin-bottom: 18px; }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid #EFE6D6; font-size: 14px; }
    .row:first-of-type { border-top: none; }
    .row span:first-child { color: #6B5B47; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
    .metric .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8B7355; margin-bottom: 6px; }
    .metric .value { font-family: Georgia, serif; font-size: 26px; }
    ul { list-style: none; }
    li { font-size: 14px; color: #4A3A2C; padding: 6px 0; line-height: 1.5; }
    p.note { font-size: 13px; color: #6B5B47; line-height: 1.6; }
    a { color: #2C1810; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">evgn OS</div>
    <div class="divider"></div>
    <div id="content"></div>
  </div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var err = p.get('err');
      var el = document.getElementById('content');
      document.title = (p.get('name') || 'evgn OS') + ' · evgn OS';

      if (err) {
        el.innerHTML =
          '<h1>Open evgn OS from your Shopify admin</h1>' +
          '<p class="sub">' + esc(err) + '</p>' +
          '<div class="card"><p class="note">In your Shopify admin, go to <strong>Apps</strong> and select <strong>evgn OS</strong> to view your connection.</p></div>';
        return;
      }

      var shop      = p.get('shop') || '';
      var name      = p.get('name') || shop;
      var active    = p.get('active') !== '0';
      var installed = p.get('installed') || '—';
      var orders    = p.get('orders');
      var revenue   = p.get('revenue');
      var currency  = p.get('currency') || 'USD';
      var products  = p.get('products');

      var metricsHtml;
      if (orders !== null && revenue !== null) {
        var money = new Intl.NumberFormat('en-US', { style: 'currency', currency: currency }).format(parseFloat(revenue));
        metricsHtml =
          '<div class="metrics">' +
          '<div class="metric"><div class="label">Orders</div><div class="value">' + parseInt(orders).toLocaleString('en-US') + '</div></div>' +
          '<div class="metric"><div class="label">Revenue</div><div class="value">' + esc(money) + '</div></div>' +
          (products !== null ? '<div class="metric"><div class="label">Products</div><div class="value">' + parseInt(products).toLocaleString('en-US') + '</div></div>' : '') +
          '</div>';
      } else {
        metricsHtml = '<p class="note">Your store summary is temporarily unavailable. Your connection is still active.</p>';
      }

      el.innerHTML =
        '<h1>' + esc(name) + ' is connected</h1>' +
        '<p class="sub"><span class="status"><span class="dot"></span>' + (active ? 'Active' : 'Inactive') + '</span></p>' +

        '<div class="card"><h2>Last 30 days</h2>' + metricsHtml + '</div>' +

        '<div class="card"><h2>Connection</h2>' +
        '<div class="row"><span>Store</span><span>' + esc(shop) + '</span></div>' +
        '<div class="row"><span>Connected</span><span>' + esc(installed) + '</span></div>' +
        '<div class="row"><span>Access</span><span>Read-only</span></div>' +
        '<div class="row"><span>Sync</span><span>Real-time, as orders and products change</span></div>' +
        '</div>' +

        '<div class="card"><h2>What\'s shared with your evgn team</h2>' +
        '<ul>' +
        '<li>Orders, including totals, line items, and fulfillment status</li>' +
        '<li>Products, pricing, and inventory levels</li>' +
        '<li>Customer identifiers linked to orders</li>' +
        '<li>Store analytics, reports, locations, and shipping settings</li>' +
        '</ul>' +
        '<p class="note" style="margin-top:14px">Your evgn advisory team uses this data to prepare your performance reports and recommendations. evgn OS never changes anything in your store.</p>' +
        '</div>' +

        '<div class="card"><h2>Privacy and disconnecting</h2>' +
        '<p class="note">Read our <a href="https://www.evgnagency.com/privacy-policy" target="_blank" rel="noopener">privacy policy</a>. To disconnect, go to <strong>Settings → Apps</strong> in your Shopify admin and uninstall evgn OS. Questions? Email <a href="mailto:hello@evergreennewyork.com">hello@evergreennewyork.com</a>.</p>' +
        '</div>';

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function(c) {
          return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
        });
      }
    })();

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }
  </script>
</body>
</html>
