<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evergreen OS — Connect Your Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background-color: #F5F0E6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .wordmark {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8B7355;
      margin-bottom: 48px;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: #C4B49A;
      margin: 0 auto 40px;
    }
    h1 {
      font-size: 28px;
      font-weight: 400;
      color: #2C1810;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      font-size: 15px;
      color: #6B5B47;
      margin-bottom: 40px;
      line-height: 1.6;
      font-family: 'Helvetica Neue', sans-serif;
    }
    input {
      width: 100%;
      padding: 14px 18px;
      font-size: 15px;
      font-family: 'Helvetica Neue', sans-serif;
      border: 1px solid #C4B49A;
      border-radius: 2px;
      background: #FDFAF5;
      color: #2C1810;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #8B7355; }
    input::placeholder { color: #B0A090; }
    button {
      width: 100%;
      padding: 14px 24px;
      background: #2C1810;
      color: #F5F0E6;
      border: none;
      border-radius: 2px;
      font-size: 13px;
      font-family: 'Helvetica Neue', sans-serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4A2E20; }
    .error {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: #8a4030;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wordmark">Evergreen OS</div>
    <div class="divider"></div>
    <h1>Connect Your Store</h1>
    <p>Enter your Shopify store domain below to connect it to the Evergreen operating system.</p>
    <div class="error" id="error">Please enter a valid Shopify domain (e.g. yourstore.myshopify.com)</div>
    <form id="form">
      <input
        type="text"
        id="shop"
        name="shop"
        placeholder="yourstore.myshopify.com"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <button type="submit">Connect Store</button>
    </form>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      var shop = document.getElementById('shop').value.trim().toLowerCase();
      var err = document.getElementById('error');
      if (!shop.match(/^[a-zA-Z0-9][a-zA-Z0-9\-]*\.myshopify\.com$/)) {
        err.style.display = 'block';
        return;
      }
      err.style.display = 'none';
      window.location.href = 'https://qrapkrmtzkkrxpavxodk.supabase.co/functions/v1/shopify_install_public?shop=' + encodeURIComponent(shop);
    });
  </script>
</body>
</html>
